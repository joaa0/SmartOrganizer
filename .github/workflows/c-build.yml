name: C Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: gcc -Wall -Wextra -std=c11 main.c -o organizador

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile
        shell: bash
        run: gcc -Wall -Wextra -std=c11 main.c -o organizador.exe -lshell32
