
name: C Cross-Platform Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 -O2 main.c -o organizador

      - name: Verify
        run: |
          test -x organizador
          file organizador

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        shell: bash
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 -O2 main.c -o organizador.exe -lshell32 -lole32 -luuid

      - name: Verify
        shell: bash
        run: |
          test -f organizador.exe
          file organizador.exe
